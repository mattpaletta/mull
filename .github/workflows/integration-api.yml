name: Integration API
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - "mull_llvm.bzl"
      - "mull_llvm_source.bzl"
      - "mull_test.bzl"
      - "examples/integration_api/**"
      - ".github/workflows/integration-api.yml"
jobs:
  load-test:
    name: Starlark load test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Install LLVM 19
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 19
          sudo apt-get install -y --no-install-recommends \
            llvm-19-dev libclang-19-dev libclang-cpp19-dev
      - uses: bazel-contrib/setup-bazel@0.8.5
        with:
          bazelisk-cache: true
          repository-cache: true
          disk-cache: integration-api
      - uses: ./.github/actions/setup-bazel-cache
        with:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
          PLATFORM: ubuntu-24.04-x86_64
      - name: Sanity-load the new bzl entrypoints
        working-directory: examples/integration_api
        run: bazelisk query //... --check_direct_dependencies=off
  build-smoke-test:
    name: Build mull_test target (LLVM 19)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Install LLVM 19
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 19
          sudo apt-get install -y --no-install-recommends \
            llvm-19-dev libclang-19-dev libclang-cpp19-dev
      - uses: bazel-contrib/setup-bazel@0.8.5
        with:
          bazelisk-cache: true
          repository-cache: true
          disk-cache: integration-api-build
      - uses: ./.github/actions/setup-bazel-cache
        with:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
          PLATFORM: ubuntu-24.04-x86_64
      # Build the regular cc_test and the mull-instrumented cc_binary that
      # `mull_test` generates. The mull_test target itself is `manual`, so
      # it is named explicitly here.
      - name: Build calculator_test
        working-directory: examples/integration_api
        run: bazelisk build //:calculator_test
      - name: Build calculator_mull (instrumented binary + runner script)
        working-directory: examples/integration_api
        run: bazelisk build //:calculator_mull
